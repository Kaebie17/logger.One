<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="media/icons/icon180.png?v=2">
    <link rel="icon" href="media/icons/icon192.png?v=2">
    <meta name="theme-color" content="#0F0F0F">

<body id="pastworkout">
    <header id="header">
        <img src="" alt="">
        <h1>logger.One</h1>
    </header>
    <div id="container">
        <h1 id="name">Upper</h1>
        <div id="snapshot"><span>Duration<b>1</b></span><span>Volume<b>1000</b></span><span>Intensity<b>7</b></span><span>Fatigue<b>7</b></span><span>Systemic Fatigue<b></b></span></div>
        <h2>Workout Log</h2>
        <div id="exercises">
            
        </div>
        <div id="expand">
            <h1 id="exname"></h1>
            <p id="mgroups"></p>
            <div id="summary1"><span>Rest<b>1</b></span><span>Max<b>1000</b></span><span>RIR<b>7</b></span><span>TUT<b>7</b></span></div>
            <div id="exdetails"></div>
            <div id="summary2"><span>Sets<b>1</b></span><span>Reps<b>1000</b></span><span>Volume<b>7</b></span><span>Progress<b>7</b></span></div>
            <span id="close">❌</span>
        </div>
        <section id="svgcontainer">

        </section>
        <section id="calendar">
            <div class="label-area"><p onclick="scrollMonth(event)"><<</p><p onclick="scrollMonth(event)">>></p></div>
        </section>
        <section id="workoutactions">
            <button id="deleteworkout">Remove Workout</button>
            <button id="changedate">Change Date</button>
            <button id="editsystemicfatigue">Edit Systemic Fatigue</button>
        </section>
    </div>
    <footer id="footer">
        <a href="history.html">Close</a>
    </footer>
    <script id="" src="exercisesDB.js"></script>
    <!-- pastworkout.js is injected by functions.js once workout data has loaded -->
    <script id="" src="functions.js"></script>
</body>
</html>
