<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Workout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="createworkoutpage">
    <header id="header">
        <img src="" alt="">
        <h1>logger.One</h1>
    </header>
    <form id="createworkoutform">
        <p>Choose your program</p>
        <select  name="a_chooseprogram" id="chooseprogram">
            <option value="Make a choice" selected>Choose from drop down</option>
            <optgroup label="Push-Pull-Leg">
                <option value="Push">Push</option>
                <option value="Pull">Pull</option>
                <option value="Legs">Legs</option>
            </optgroup>
            <optgroup label="Upper-Lower">
                <option value="Upper">Upper</option>
                <option value="Lower">Lower</option>
            </optgroup>
            <optgroup label="Full body">
                <option value="fullbody">Full Body</option>
                
            </optgroup>
        </select>
        <p>Or</p>
        <input type="text" id="selectedprogram" placeholder="click to input workout plan...">
        <hr/>
        <section id="clocksvgarea">
            <div>
                <span id="from">
                    <h2>Start</h2>
                    <input type="date" id="from_dateselector">
                    <span>
                    <output id="from_disphour" class="boxdisplay"></output>
                    <span>:</span>
                    <output id="from_dispmin" class="boxdisplay"></output>
                    <Select class="boxdisplay">
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </Select>
                    </span>
                </span>
                <span id="to">
                    <h2>Finish</h2>
                    <input type="date" id="to_dateselector">
                    <span>
                    <output id="to_disphour"></output>
                    <span>:</span>
                    <output id="to_dispmin"></output>
                    <Select>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </Select>
                    </span>
                </span>
            </div>
        </section>
        <hr/>
        <div id="snapshotcontainer">
            <div id="addexercises">Add Exercises</div>
        </div>
        <hr/>
        <span class="scale"><p>Intensity</p><input type="range" name="" id="intensity" value="0" min="0" max="10" step="1" list="markers"/><a class="infobite">ℹ️</a></span>
        <span class="scale"><p>Soreness</p><input type="range" name="" id="soreness" value="0" min="0" max="10" step="1" list="markers" disabled/><a class="infobite">ℹ️</a></span>
        <datalist id="markers">
            <option value="1"></option>
            <option value="2"></option>
            <option value="3"></option>
            <option value="4"></option>
            <option value="5"></option>
            <option value="6"></option>
            <option value="7"></option>
            <option value="8"></option>
            <option value="9"></option>
            <option value="10"></option>
        </datalist>
        <hr/>
        <input type="button" name="saveworkout" id="saveworkout" value="Save Workout">
    </form>
    <footer id="footer">
        <a href="index.html#weeklystatus">Close</a>
    </footer>
    <script src="savedworkouts.js"></script>
    <script id="logworkoutJS" src="logworkout.js"></script>
</body>
</html>
