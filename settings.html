<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="media/icons/icon180.png?v=2">
    <link rel="icon" href="media/icons/icon192.png?v=2">
    <meta name="theme-color" content="#0F0F0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Logger.One">
    <title>Settings</title>
</head>
<body id="settingspage">
    <header id="header">
        <img src="" alt="">
        <h1>logger.One</h1>
    </header>
    <!-- Was <form action="">. Nothing here ever relied on real form
         submission -- saveSettings() reads each field's .value directly and
         writes to localStorage itself, no server, no action="" navigation
         ever intended to fire. But being a <form> WITH several `required`
         fields meant any click the browser treated as a submit attempt
         (fixed once already with type="button" on every button) could still
         trigger native validation/submission handling -- and installed
         PWAs on iOS are documented to handle in-app form submission
         differently than a regular Safari tab, which lines up with this
         page specifically (the only one in the app using a <form> at all)
         misbehaving only in the installed app, never in Safari. A plain
         div removes the entire mechanism instead of patching around it
         again -- required attributes are now inert (harmless) since
         there's no form left to validate against. -->
    <div id="settingscontainer">
        <fieldset id="preferences">
            <span id="unitspan"><label for="unitval">Select Unit</label><select id="unitval" required><option value="" selected></option><option value="metric">Metric</option><option value="imperial">Imperial</option></select></span>
            <span id="barbellspan"><label for="barbellval">Barbell weight</label><span><input type="number" id="barbellval" step="0.1" required><p id="barbellunit">kgs</p></span></span>
            <span id="dumbbellspan"><label for="dumbbellval">Dumbbell weight</label><span><input type="number" id="dumbbellval" step="0.1" required><p id="dumbbellunit">kgs</p></span></span>
            <span id="bodywtspan"><label for="bodywtval">Bodyweight factor</label><span><input type="number" max="1" min="0.1" step="0.1" id="bodywtval" required><p id="afterfactor" hidden></p></span></span>
            <legend>Preferences</legend>
        </fieldset>
        <fieldset id="personalinfo">
            <span id="namespan"><label for="nameval">Name</label><input type="text" id="nameval" required></span>
            <span id="emailspan"><label for="emailval">E-mail</label><input type="email" id="mailval" required></span>
            <span id="genderspan"><label for="genderval">Gender</label><select id="genderval" required><option value="" selected></option><option value="male">Male</option><option value="female">Female</option><option value="them">Other</option></select></span>
            <span id="agespan"><label for="ageval">Age</label><input type="number" id="ageval" required></span>
            <span id="weightspan"><label for="weightval">Weight</label><span><input type="number" id="weightval" step="0.1" required><p id="wtunit">kgs</p></span></span>
            <span id="heightspan"><label for="heightval">Height</label><span><input type="number" id="heightval" step="0.01" required><p id="ftsymbol" hidden>'</p><input type="number" id="inchesval" min="0" max="11" step="0.1" placeholder="in" hidden><p id="htunit">mts</p></span></span>
            <!-- <a href="">Log Measurements</a> -->
            <legend>Personal Info</legend>
        </fieldset>
        <button type="button" id="donebtn">Done</button>
        <button type="button" id="logmeasurementsbtn">Log Measurements</button>
        <!-- Import/Export/Backup/Restore used to sit inline here -- moved
             into their own popup (see #datamanagementprompt below),
             reached through this one trigger button, decluttering the
             main page. -->
        <button type="button" id="datamanagementbtn">Reset &amp; Backup</button>
    </div>
    <dialog id="datamanagementprompt">
        <span class="modal-close">❌</span>
        <p>Data Management</p>
        <button type="button" id="importdata">Workout Log Import</button>
        <button type="button" id="exportdata">Workout Log Export</button>
        <!-- "Workout Log Export" above only ever covered workout logs (CSV)
             -- these two cover EVERYTHING (workouts, templates, muscle
             soreness, custom exercises, settings) as one portable JSON
             file. -->
        <button type="button" id="fullbackupdata">Backup All Data</button>
        <button type="button" id="fullrestoredata">Restore All Data</button>
    </dialog>
    <dialog id="addmeasurements" style="top:20vh">
        <table id="measurementstable">
            <tr>
                <td><b>Part</b></td><td><b>Average Size</b></td><td><b>Unit</b></td>
            </tr>
        </table>
    </dialog>
    <footer id="footer">
        <div class="footer-row">
        <a href="index.html#weeklystatus">Close</a>
        </div>
    </footer>
    <script src="exercisesDB.js"></script>
    <!-- settings.js is injected by functions.js once workout data has loaded -->
    <script src="functions.js"></script>
</body>
</html>
