<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="media/icons/icon180.png?v=2">
    <link rel="icon" href="media/icons/icon192.png?v=2">
    <meta name="theme-color" content="#0F0F0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Logger.One">
    <title>Document</title>
</head>
<body id="profilepage">
    <header id="header">
        <img src="" alt="">
        <h1>logger.One</h1>
    </header>
    <input type="file" id="fronthead" accept="image/*" hidden>
    <input type="file" id="backhead" accept="image/*" hidden>
    <dialog id="cropperdialog">
        <span class="modal-close" id="closecropper">&#10005;</span>
        <div id="cropviewport">
            <img id="cropimage" draggable="false" alt="">
            <div id="cropframe"></div>
        </div>
        <label id="cropzoomlabel">Zoom<input type="range" id="cropzoom" min="0.2" max="4" step="0.01" value="1"></label>
        <label id="cropsizelabel">Size<input type="range" id="cropsize" min="20" max="100" step="1" value="60"></label>
        <button id="cropconfirm">Crop &amp; Save</button>
    </dialog>
    <div id="container">

    </div>
    <footer id="footer">
        <a href="index.html">Close</a>
    </footer>
    <script id="functionsJS" src="functions.js"></script>
    <script id="svgcodeJS" src="svgcode.js"></script>
</body>
</html>
