<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="media/icons/icon180.png?v=2">
    <link rel="icon" href="media/icons/icon192.png?v=2">
    <meta name="theme-color" content="#0F0F0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Logger.One">
    <title>Document</title>
</head>
<body id="trendspage">
    <header id="header">
        <img src="" alt="">
        <h1>logger.One</h1>
    </header>
    <div id="container">
        <section id="mainfilters">
            <span>
                <span><input type="radio" id="option1" value="uniquePrograms" name="mainradios"><label for="option1">Programs</label></span>
                <span><input type="radio" id="option2" value="exerciseNameIds" name="mainradios"><label for="option2">Exercises</label></span>
                <span><input type="radio" id="option3" value="uniqueTargets" name="mainradios"><label for="option3">Bodypart</label></span>
            </span>
            <select id="mainfilteroptions">
            </select>
        </section>
        <h2>Custom Stats</h2>
        <section id="custom">
            <select id="dailyfilteroptions">
                <option value="repCount">Reps</option>
                <option value="weight">Weight</option>
                <option value="load">Load</option>
                <option value="vol" selected>Volume</option>
                <option value="setCount">Sets</option>
            </select>
            <div id="svgcustom">
                <div id="graphics"></div>
                <div id="dailytoggle" style="z-index: 1;"><a class="prevBtn"><<</a>&nbsp;&nbsp;&nbsp;<a class="nextBtn">>></a></div>
                <div id="legend">
                    <a>ℹ</a>
                </div>
            </div>
        </section>
        <h2>Weekly Stats</h2>
        <section id="weeklytrends">
            <select id="weeklyfilteroptions">
                <option value="repCount">Reps</option>
                <option value="weight">Weight</option>
                <option value="load">Load</option>
                <option value="vol" selected>Volume</option>
                <option value="setCount">Sets</option>
            </select>
            <div id="svgweekly">
                <div id="graphics"></div>
                <div id="weeklytoggle" style="z-index: 1;"><a class="prevBtn"><<</a>&nbsp;&nbsp;&nbsp;<a class="nextBtn">>></a></div>
                <div id="legend">
                    <a>ℹ</a>
                </div>
            </div>
        </section>
        <h2>Monthly Stats</h2>
        <section id="monthlytrends">
            <select id="monthlyfilteroptions">
                 <option value="repCount">Reps</option>
                <option value="weight">Weight</option>
                <option value="load">Load</option>
                <option value="vol" selected>Volume</option>
                <option value="setCount">Sets</option>
            </select>
            <div id="svgmonthly">
                <div id="graphics"></div>
                <div id="monthlytoggle" style="z-index: 1;"><a class="prevBtn"><<</a>&nbsp;&nbsp;&nbsp;<a class="nextBtn">>></a></div>
                <div id="legend">
                    <a>ℹ</a>
                </div>
            </div>
        </section>

    </div>
    <footer id="footer">
        <a href="index.html#weeklystatus">Close</a>
    </footer>
    <!-- trends.js is injected by functions.js once workout data has loaded -->
    <script src="functions.js"></script>
</body>
</html>
