<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body id="trendspage">
    <header id="header">
        <img src="" alt="">
        <h1>logger.One</h1>
    </header>
    <div id="container">
        <section id="mainfilters">
            <span>
                <span><input type="radio" id="option1" value="programs"><label for="option1">Programs</label></span>
                <span><input type="radio" id="option2" value="exercises"><label for="option2">Exercises</label></span>
                <span><input type="radio" id="option3" value="bodypart"><label for="option3">Bodypart</label></span>
            </span>
            <select id="mainfilteroptions">
            </select>
        </section>
        <h2>Custom Stats</h2>
        <section id="custom">
            <select id="dailyfilteroptions">
                <option value="repCount">Reps</option>
                <option value="weight">Weight</option>
                <option value="load">Load</option>
                <option value="vol" selected>Volume</option>
                <option value="setCount">Sets</option>
            </select>
            <div id="svgcustom">
                <div id="graphics"></div>
                <div id="legend">
                    <a>ℹ</a>
                </div>
            </div>
        </section>
        <h2>Weekly Stats</h2>
        <section id="weeklytrends">
            <select id="weeklyfilteroptions">
                <option value="repCount">Reps</option>
                <option value="weight">Weight</option>
                <option value="load">Load</option>
                <option value="vol" selected>Volume</option>
                <option value="setCount">Sets</option>
            </select>
            <div id="svgweekly">
                <div id="graphics"></div>
                <div style="z-index: 1;"><a id="prev"><<</a>&nbsp;&nbsp;&nbsp;<a id="next">>></a></div>
                <div id="legend">
                    <a>ℹ</a>
                </div>
            </div>
        </section>
        <h2>Monthly Stats</h2>
        <section id="monthlytrends">
            <select id="monthlyfilteroptions">
            </select>
            <div id="svgmonthly">
                <div id="graphics"></div>
                <div id="legend">
                    <a>ℹ</a>
                </div>
            </div>
        </section>

    </div>
    <footer id="footer">
        <a href="index.html#weeklystatus">Close</a>
    </footer>
    <script id="trendsJS" src="trends.js"></script>
</body>
</html>
